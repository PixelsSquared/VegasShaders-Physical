# TEST build (PixelsSquared fork): the DLL and the full Plugins/Shaders/Textures tree, as build.bat makes it, uploaded as an artifact.
name: Build test package
on:
  push:
    branches: [belt-of-venus-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86
      - uses: nuget/setup-nuget@v2
      - name: Restore NuGet packages
        run: nuget restore TESReloaded.sln
      - name: Build (v142, else v143)
        shell: cmd
        run: |
          msbuild TESReloaded.sln -target:NewVegasReloaded /p:Configuration=Release /p:Platform=x86 -m -v:minimal
          if errorlevel 1 (
            echo v142 build failed, retrying with the v143 toolset
            msbuild TESReloaded.sln -target:NewVegasReloaded /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 -m -v:minimal
          )
      - name: Package (build.bat's copy steps)
        shell: cmd
        run: |
          if not exist NewVegasReloaded\Release\VegasShaders.dll exit /b 1
          echo.| call build.bat NewVegasReloaded
          if not exist build\NewVegasReloaded\nvse\Plugins\VegasShaders.dll exit /b 1
          exit /b 0
      - uses: actions/upload-artifact@v4
        with:
          name: VegasShaders-1.0.3-belt-of-venus-test
          path: build/NewVegasReloaded/
      - name: Zip (without VegasShaders.toml, so installing keeps your settings)
        shell: pwsh
        run: |
          Remove-Item build/NewVegasReloaded/nvse/Plugins/VegasShaders.toml -ErrorAction SilentlyContinue
          Compress-Archive -Path build/NewVegasReloaded/* -DestinationPath VegasShaders-1.0.3-belt-of-venus-test.zip
          Get-ChildItem build/NewVegasReloaded/nvse/Plugins | Format-Table Name, Length
      - name: Publish as a pre-release on this fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="belt-of-venus-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" VegasShaders-1.0.3-belt-of-venus-test.zip --prerelease --target "$GITHUB_SHA" \
            --title "1.0.3 belt of Venus TEST (build ${GITHUB_RUN_NUMBER})" \
            --notes "Vegas Shaders 1.0.3 with the physical sky kept through civil twilight (full to a sun 4 degrees below the horizon, fading out by 10 degrees below) and 24 view-ray steps. TEST build, replaces the stock behaviour. Built by GitHub Actions with the v143 toolset. VegasShaders.toml is not included, so your settings stay."
